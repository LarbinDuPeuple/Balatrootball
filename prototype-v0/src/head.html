<title>Mercato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Mise en page : un stade de nuit, panneaux sombres autour du terrain, main de cartes vignettes en bas */
:root {
  --night: #151826; --panel: #20263a; --panel-2: #2b3350; --edge: #0a0c14;
  --cream: #f3e7c9; --cream-2: #e2d3ad; --ink: #1d1a22; --muted: #9aa3c0;
  --gold: #f4c34f; --red: #e8573a; --green: #6fcf4f; --sky: #7fc3ea;
  --bronze: #b97a46; --silver: #b9c3cf; --goldcard: #e9b93a;
  --f-ui: "Pixelify Sans", "Courier New", monospace;
  --f-big: "Press Start 2P", "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--cream); font-family: var(--f-ui); font-size: 16px; line-height: 1.3;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
* { box-sizing: border-box; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font-family: var(--f-ui); font-size: 16px; font-weight: 700; color: var(--ink); background: var(--gold); border: 3px solid var(--edge);
  box-shadow: 0 4px 0 var(--edge); padding: 8px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; }
button:hover:not(:disabled) { filter: brightness(1.08); }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
button:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
button.alt { background: var(--sky); }
button.ghost { background: var(--panel-2); color: var(--cream); }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.screen { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 3px solid var(--edge); box-shadow: inset 0 0 0 2px var(--panel-2); padding: 10px 12px; }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-family: var(--f-big); font-size: 15px; color: var(--gold); letter-spacing: .02em; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }

/* Titre */
#title { align-items: center; text-align: center; padding-top: 4vh; gap: 20px; }
.logo { font-family: var(--f-big); font-size: clamp(30px, 8vw, 64px); color: var(--gold); text-shadow: 4px 4px 0 var(--red), 8px 8px 0 var(--edge); letter-spacing: .04em; }
.tagline { font-size: 20px; color: var(--sky); }
#title-canvas { width: min(560px, 100%); border: 3px solid var(--edge); }
.howto { max-width: 640px; text-align: left; }
.howto ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 6px; }

/* Match */
.scorebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.sb-team { font-family: var(--f-big); font-size: clamp(11px, 2vw, 16px); text-transform: uppercase; line-height: 1.4; }
.sb-team.opp { text-align: right; }
.sb-score { font-family: var(--f-big); font-size: clamp(22px, 4vw, 34px); color: var(--gold); white-space: nowrap; }
.sb-score .need { display: block; font-family: var(--f-ui); font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .06em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.meta .chip { display: inline-flex; gap: 6px; align-items: baseline; }
.meta .val { font-family: var(--f-big); font-size: 13px; color: var(--cream); }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 10px; height: 10px; background: var(--gold); border: 2px solid var(--edge); }
.pip.off { background: var(--panel-2); }
.rule-chip { background: var(--red); color: var(--cream); padding: 3px 8px; border: 2px solid var(--edge); font-weight: 700; }
.arena { display: grid; grid-template-columns: 200px minmax(0, 1fr) 250px; gap: 12px; align-items: stretch; }
.side, .calc { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.slot-list { display: grid; gap: 6px; }
.slot { background: var(--panel-2); border: 2px solid var(--edge); padding: 6px 8px; font-size: 14px; }
.slot b { display: block; color: var(--gold); font-size: 14px; }
.slot.empty { color: var(--muted); border-style: dashed; }
.item-btn { width: 100%; text-align: left; font-size: 13px; padding: 6px 8px; text-transform: none; letter-spacing: 0; background: var(--sky); }
.item-btn small { display: block; font-weight: 400; }
.pitchwrap { position: relative; border: 3px solid var(--edge); background: #2f7a32; min-width: 0; align-self: start; }
#pitch { width: 100%; height: auto; aspect-ratio: 240 / 136; }
.burst { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.burst span { font-family: var(--f-big); font-size: clamp(28px, 7vw, 64px); color: var(--gold); text-shadow: 4px 4px 0 var(--red), 7px 7px 0 var(--edge); animation: pop .9s steps(6) both; }
.burst span.miss { color: var(--cream); text-shadow: 3px 3px 0 var(--edge); font-size: clamp(16px, 3.5vw, 30px); }
@keyframes pop { 0% { transform: scale(.2); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.calc .panel { display: flex; flex-direction: column; gap: 6px; }
.c-move { font-family: var(--f-big); font-size: 12px; color: var(--sky); line-height: 1.5; min-height: 36px; }
.c-formula { font-size: 15px; color: var(--cream-2); }
.c-danger { font-family: var(--f-big); font-size: 30px; color: var(--red); text-shadow: 3px 3px 0 var(--edge); }
.c-verdict { font-weight: 700; font-size: 15px; }
.c-verdict.goal { color: var(--green); }
.c-verdict.none { color: var(--muted); }
.syn { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.syn li { background: var(--panel-2); border-left: 4px solid var(--gold); padding: 3px 6px; }
.syn li.bad { border-left-color: var(--red); }
details { font-size: 13px; }
.mv { display: flex; justify-content: space-between; gap: 6px; padding: 4px 6px; border-left: 4px solid var(--panel-2); background: var(--panel-2); font-size: 13px; }
.mv.on { border-left-color: var(--green); background: #2f4a3a; }
.mv .lv { color: var(--gold); }
.mv .hint { font-size: 12px; }
.mv .num { white-space: nowrap; color: var(--cream-2); }
.booster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
.pickable { cursor: pointer; }
.pickable .tile { height: 100%; }
.pickable.on .tile { box-shadow: 0 0 0 3px var(--gold); transform: translateY(-3px); }
.tile.move { border-left: 8px solid var(--silver); }
.tile.t-commun { border-left-color: var(--green); } .tile.t-rare { border-left-color: var(--sky); } .tile.t-epique { border-left-color: #c58cf0; }
.own-moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.own-moves .tile { font-size: 14px; }
button.danger { background: var(--red); color: var(--cream); }
details summary { cursor: pointer; color: var(--gold); font-weight: 700; }
.moves { display: grid; gap: 4px; margin-top: 2px; }
.handbar { display: flex; flex-direction: column; gap: 10px; }
.hand { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; padding-top: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.actions .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.deckinfo { color: var(--muted); font-size: 14px; }

/* Carte joueur */
.card { position: relative; background: var(--cream); color: var(--ink); border: 3px solid var(--edge); box-shadow: inset 0 0 0 3px var(--frame, var(--bronze)), 0 4px 0 var(--edge);
  padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; user-select: none; transition: transform .08s steps(2); min-width: 0; }
.card.r-argent { --frame: var(--silver); } .card.r-or { --frame: var(--goldcard); }
.card.r-legende { --frame: #c58cf0; background: linear-gradient(135deg, #f7e9ff, #e6fbff 40%, #fff6d8 70%, #ffe3f2); }
.card.sel { transform: translateY(-12px); box-shadow: inset 0 0 0 3px var(--frame, var(--bronze)), 0 0 0 3px var(--gold), 0 6px 0 var(--edge); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--cream); background: var(--clubc, #456); padding: 2px 4px; min-width: 0; }
.card .top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .top canvas { width: 18px; height: 12px; flex: none; border: 1px solid var(--edge); }
.card .pic { position: relative; }
.card .pic canvas { width: 100%; height: auto; aspect-ratio: 1; border: 2px solid var(--edge); }
.card .note { position: absolute; right: -4px; bottom: -6px; width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--f-big); font-size: 11px;
  background: var(--green); border: 3px solid var(--edge); border-radius: 50%; color: var(--ink); }
.card.r-or .note, .card.r-legende .note { background: var(--gold); }
.card .nm { font-weight: 700; font-size: 13px; line-height: 1.15; text-transform: uppercase; overflow-wrap: anywhere; margin-top: 4px; }
.card .st { font-size: 11px; text-transform: uppercase; color: #4a4458; line-height: 1.2; min-height: 26px; }
.card .ft { display: flex; justify-content: space-between; align-items: center; font-size: 11px; border-top: 2px dashed var(--cream-2); padding-top: 2px; }
.card .fat { display: inline-flex; gap: 2px; }
.card .fat i { width: 7px; height: 7px; background: var(--green); border: 1px solid var(--edge); }
.card .fat i.used { background: var(--red); }
.card .star { position: absolute; left: 8px; top: 30px; font-family: var(--f-big); font-size: 9px; background: var(--red); color: var(--cream); padding: 2px 3px; border: 2px solid var(--edge); }

/* Mercato */
.merc-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.money { font-family: var(--f-big); font-size: 13px; line-height: 1.8; }
.money .warn { color: var(--red); }
.shop { display: grid; grid-template-columns: repeat(4, minmax(0, 190px)); gap: 16px; justify-content: center; }
.offer { display: flex; flex-direction: column; gap: 8px; }
.offer .price { font-family: var(--f-big); font-size: 12px; text-align: center; color: var(--green); background: var(--edge); padding: 6px; border: 2px solid var(--green); }
.shop-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.shop-col { display: flex; flex-direction: column; gap: 8px; }
.tile { background: var(--cream); color: var(--ink); border: 3px solid var(--edge); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.tile b { text-transform: uppercase; }
.tile .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6b6478; }
.tile .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile button { font-size: 13px; padding: 5px 10px; }
.tile.staff { border-left: 8px solid var(--green); } .tile.item { border-left: 8px solid var(--sky); } .tile.train { border-left: 8px solid var(--gold); }
.squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.squad .cell { display: flex; flex-direction: column; gap: 6px; }
.squad .cell button { font-size: 12px; padding: 5px 6px; background: var(--red); color: var(--cream); }
.squad .card { cursor: default; }
.next-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.hint { color: var(--muted); font-size: 14px; }

/* Modale */
.modal { position: fixed; inset: 0; background: rgba(5, 6, 12, .78); display: grid; place-items: center; z-index: 20;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { background: var(--panel); border: 4px solid var(--edge); box-shadow: inset 0 0 0 3px var(--gold); padding: 20px; max-width: 560px; max-height: 100%; overflow-y: auto; width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.modal .big { font-family: var(--f-big); font-size: 22px; color: var(--gold); line-height: 1.4; }
.modal table { width: 100%; border-collapse: collapse; font-size: 15px; }
.modal td { padding: 3px 0; border-bottom: 1px dashed var(--panel-2); text-align: left; }
.modal td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.modal .rule { background: var(--red); padding: 8px; border: 2px solid var(--edge); }

@media (max-width: 980px) {
  .arena { grid-template-columns: minmax(0, 1fr) 230px; }
  .side { grid-column: 1 / -1; order: 3; display: grid; grid-template-columns: 1fr 1fr; }
  .shop { grid-template-columns: repeat(2, minmax(0, 190px)); }
}
@media (max-width: 680px) {
  .arena { grid-template-columns: minmax(0, 1fr); }
  .side { grid-template-columns: 1fr; }
  .hand { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .shop-row { grid-template-columns: 1fr; }
  .c-danger { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .burst span { animation: none; } .card { transition: none; } }
</style>
